name: Quick Cleanup

on:
  workflow_dispatch:
    inputs:
      cleanup_mode:
        description: Cleanup intensity (auto, light, aggressive, skip)
        required: false
        default: auto
        type: choice
        options:
          - auto
          - light
          - aggressive
          - skip

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Run quick cleanup
        uses: palmsoftware/quick-cleanup@v0.0.3
        with:
          cleanup-mode: ${{ inputs.cleanup_mode }}
